<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dreamscape — Explicador</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; color: #f8fafc; overflow: hidden; }
    .scene {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      padding: 4rem;
      text-align: center;
    }
    .badge {
      padding: 0.5rem 1.5rem;
      background: rgba(139,92,246,0.15);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 999px;
      font-size: 0.85rem;
      color: #a78bfa;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1rem;
    }
    h1 span {
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.25rem;
      color: #94a3b8;
      max-width: 600px;
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="badge">⚡ IA + Edición Profesional</div>
    <h1>Donde la <span>creatividad humana</span> se encuentra con la IA</h1>
    <p>Automatización, velocidad y creatividad para tu contenido.</p>
  </div>
</body>
</html>
