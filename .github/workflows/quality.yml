name: Quality Check

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Run API tests
        run: npm test -- --testPathPattern="tests/api" --verbose
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          OPENAI_API_KEY: test

      - name: Check HTML validity
        uses: Cyb3r-Jak3/html5validator-action@v7
        with:
          root: .
          skip: true

      - name: Check for broken links
        run: npx linkinator . --recurse --skip "github.com|linkedin.com|instagram.com|behance.net|fonts.googleapis.com|cdn.jsdelivr.net" 2>/dev/null || echo "Link check skipped"

      - name: Dependency audit
        run: npm audit --audit-level=moderate || echo "Audit warnings found (non-blocking)"
