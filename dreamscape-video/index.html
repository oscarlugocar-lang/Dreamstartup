<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0f; }
      body { font-family: "Inter", system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15" data-width="1920" data-height="1080" style="position:relative;width:1920px;height:1080px;overflow:hidden;background:#0a0a0f">

      <audio id="narration" src="assets/narration.wav" data-start="0" data-duration="13.4" data-media-start="0"></audio>
      <audio id="bgm" src="assets/bgm.wav" data-start="0" data-duration="15" data-media-start="0" volume="0.1"></audio>

      <div id="bg" style="position:absolute;inset:0;background:radial-gradient(ellipse at center,#1a1a2e 0%,#0a0a0f 70%)"></div>

      <div id="particles" class="clip" data-start="0" data-duration="15" data-track-index="1" style="position:absolute;inset:0;opacity:0.3">
        <div style="position:absolute;top:10%;left:15%;width:4px;height:4px;background:#8b5cf6;border-radius:50%"></div>
        <div style="position:absolute;top:30%;left:75%;width:3px;height:3px;background:#06b6d4;border-radius:50%"></div>
        <div style="position:absolute;top:60%;left:20%;width:5px;height:5px;background:#8b5cf6;border-radius:50%"></div>
        <div style="position:absolute;top:80%;left:80%;width:3px;height:3px;background:#06b6d4;border-radius:50%"></div>
        <div style="position:absolute;top:20%;left:50%;width:4px;height:4px;background:#22c55e;border-radius:50%"></div>
        <div style="position:absolute;top:70%;left:40%;width:3px;height:3px;background:#8b5cf6;border-radius:50%"></div>
      </div>

      <div id="scene1" class="clip" data-start="0" data-duration="4" data-track-index="2" style="position:absolute;inset:0">
        <div id="s1-wrap" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div id="logo" style="font-size:80px;font-weight:800;color:#fff;letter-spacing:8px;opacity:0">DREAMSCAPE</div>
          <div id="subtitle" style="font-size:20px;font-weight:300;color:#8b5cf6;letter-spacing:12px;margin-top:20px;opacity:0;text-transform:uppercase">Producciones</div>
        </div>
      </div>

      <div id="scene2" class="clip" data-start="4" data-duration="4" data-track-index="2" style="position:absolute;inset:0">
        <div id="s2-wrap" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 280px;box-sizing:border-box">
          <div id="line1" style="font-size:36px;font-weight:300;color:#94a3b8;text-align:center;line-height:1.5;opacity:0">
            Donde la creatividad humana
          </div>
          <div id="line2" style="font-size:36px;font-weight:600;color:#fff;text-align:center;line-height:1.5;margin-top:8px;opacity:0">
            se encuentra con el poder de la
          </div>
          <div id="line3" style="font-size:42px;font-weight:800;color:#8b5cf6;text-align:center;line-height:1.5;margin-top:8px;opacity:0">
            Inteligencia Artificial
          </div>
        </div>
      </div>

      <div id="scene3" class="clip" data-start="8" data-duration="4" data-track-index="2" style="position:absolute;inset:0">
        <div id="s3-wrap" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div id="serve-head" style="font-size:28px;font-weight:300;color:#94a3b8;letter-spacing:6px;margin-bottom:60px;opacity:0;text-transform:uppercase">Nuestros Servicios</div>
          <div id="cards" style="display:flex;gap:40px;opacity:0">
            <div style="width:280px;height:200px;border:1px solid rgba(139,92,246,0.3);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(139,92,246,0.08)">
              <div style="font-size:40px;font-weight:800;color:#8b5cf6">01</div>
              <div style="font-size:16px;font-weight:600;color:#fff;margin-top:12px">Video</div>
              <div style="font-size:13px;font-weight:300;color:#64748b;margin-top:4px">Producción profesional</div>
            </div>
            <div style="width:280px;height:200px;border:1px solid rgba(6,182,212,0.3);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(6,182,212,0.08)">
              <div style="font-size:40px;font-weight:800;color:#06b6d4">02</div>
              <div style="font-size:16px;font-weight:600;color:#fff;margin-top:12px">IA + Edición</div>
              <div style="font-size:13px;font-weight:300;color:#64748b;margin-top:4px">AI-powered workflow</div>
            </div>
            <div style="width:280px;height:200px;border:1px solid rgba(34,197,94,0.3);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(34,197,94,0.08)">
              <div style="font-size:40px;font-weight:800;color:#22c55e">03</div>
              <div style="font-size:16px;font-weight:600;color:#fff;margin-top:12px">Estrategia</div>
              <div style="font-size:13px;font-weight:300;color:#64748b;margin-top:4px">Contenido que convierte</div>
            </div>
          </div>
        </div>
      </div>

      <div id="scene4" class="clip" data-start="12" data-duration="3" data-track-index="2" style="position:absolute;inset:0">
        <div id="s4-wrap" style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center">
          <div id="final-msg" style="font-size:48px;font-weight:800;color:#fff;letter-spacing:4px;opacity:0">DREAMSCAPE</div>
          <div id="final-tag" style="font-size:18px;font-weight:300;color:#8b5cf6;margin-top:16px;opacity:0">dreamscape.productions</div>
          <div id="final-line" style="width:0;height:2px;background:linear-gradient(90deg,transparent,#8b5cf6,transparent);margin-top:24px"></div>
        </div>
      </div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo("#logo", { opacity: 0, y: 40, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 1.2, ease: "power3.out" }, 0.5);
      tl.fromTo("#subtitle", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 1.5);
      tl.to("#s1-wrap", { opacity: 0, duration: 0.6 }, 3.4);
      tl.set("#s1-wrap", { opacity: 0 }, 4);

      tl.fromTo("#line1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 4.2);
      tl.fromTo("#line2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 5);
      tl.fromTo("#line3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 5.8);
      tl.to("#scene2 > *", { opacity: 0, y: -20, duration: 0.5, stagger: 0.1 }, 7.2);

      tl.fromTo("#serve-head", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 8.3);
      tl.fromTo("#cards", { opacity: 0, y: 40, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.8, ease: "power3.out" }, 8.8);
      tl.to("#s3-wrap", { opacity: 0, duration: 0.5 }, 11.5);
      tl.set("#s3-wrap", { opacity: 0 }, 12);

      tl.fromTo("#final-msg", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 1, ease: "power3.out" }, 12.3);
      tl.fromTo("#final-tag", { opacity: 0, y: 15 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 13.2);
      tl.fromTo("#final-line", { width: 0 }, { width: 200, duration: 0.8, ease: "power2.out" }, 13.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
