<template>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    .kt-root { width:1080px; height:1920px; overflow:hidden; background:#0a0a0f; position:relative; font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px; }
    .kt-word { display:inline-block; font-weight:800; color:#fff; line-height:1.2; }
  </style>
  <div id="root" class="kt-root" data-composition-id="kinetic-type" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-composition-variables='[{"id":"text","type":"string","default":"La creatividad no tiene límites"},{"id":"accentColor","type":"string","default":"#8b5cf6"}]'>
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#1a1a2e 0%,#0a0a0f 70%)"></div>
    <div id="kt-content" class="clip" data-start="0" data-duration="8" data-track-index="1" style="position:relative;z-index:1;text-align:center;font-size:64px;line-height:1.3;letter-spacing:-0.02em;padding:0 20px"></div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    const v = window.__hyperframes?.getVariables?.() || {};
    const text = (v.text || "La creatividad no tiene límites").split(" ");
    const container = document.getElementById("kt-content");
    const accent = v.accentColor || "#8b5cf6";
    tl.set(container, { autoAlpha: 1 });
    text.forEach((word, i) => {
      const span = document.createElement("span");
      span.className = "kt-word";
      span.textContent = word + (i < text.length - 1 ? "\u00A0" : "");
      if (i % 3 === 0) span.style.color = accent;
      container.appendChild(span);
      tl.from(span, { opacity: 0, y: 60, rotateX: 90, duration: 0.5, ease: "back.out(1.7)" }, i * 0.15);
    });
    window.__timelines["kinetic-type"] = tl;
  </script>
</template>
